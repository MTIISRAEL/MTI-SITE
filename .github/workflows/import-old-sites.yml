name: Import old sites
on:
  workflow_dispatch:
  push:
    branches: [import-raw]
    paths: [scripts/import-old-sites.mjs, .github/workflows/import-old-sites.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/import-old-sites.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add import
          git commit -m "Import content and images from old sites" || echo "nothing to commit"
          git push
