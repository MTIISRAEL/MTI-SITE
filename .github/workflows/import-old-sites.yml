name: Import old sites
on:
  workflow_dispatch:
  push:
    branches: [import-raw]
    paths: [scripts/import-old-sites.mjs, .github/workflows/import-old-sites.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        host: [mtispa.co.il, mtibath.co.il, mti-israel.co.il]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/import-old-sites.mjs ${{ matrix.host }}
        timeout-minutes: 28
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add import
          git commit -m "Import content and images from ${{ matrix.host }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
